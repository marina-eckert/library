services:
  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  nest-library:
    build: .
    environment:
      PORT: 3002
      MONGO_URL: mongodb://mongo:27017/nest-library
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3002:3002"
volumes:
  mongo_data:
